[project]
name = "attack-agent"
version = "0.1.0"
description = "EdgeClone Attack Agent - autonomous conversational profiling and controlled social-engineering susceptibility simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "ollama>=0.3",
    "rich>=13.7",
    "loguru>=0.7",
    "tenacity>=8.2",
]

[project.scripts]
attack-agent = "attack_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.hatch.build.targets.wheel]
packages = ["src/attack_agent"]
