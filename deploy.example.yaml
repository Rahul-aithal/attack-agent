# Model routing across machines. Copy to `deploy.yaml` (on the machine that runs the server) and
# edit the node URLs. If `deploy.yaml` is absent, every role uses the single local Ollama at
# ATTACK_AGENT_OLLAMA_HOST with ATTACK_AGENT_MODEL_NAME.
#
# Each node is one model endpoint. Each role lists `node/model` routes in priority order; the
# global `fallback` list is appended to every role. If a node fails a health check or a call, the
# next route is tried. Each role uses a DIFFERENT model family (agent = Qwen, twin = Gemma,
# judge = Phi) so a model never grades output from its own family.
#
# Reference layout (3 laptops):
#   windows  — 16 GB RAM + RTX 3050 4 GB   → agent + extractor     (qwen3:8b)
#   gpubox   —  8 GB RAM + RTX 2050 4 GB   → twin + sim + backup   (gemma3:4b, llama3.2:3b)
#   mac      — MacBook M3 8 GB             → server + web UI + SQLite + judge (phi4-mini)
#
# Make each Ollama reachable on the network (OLLAMA_HOST=0.0.0.0). On a phone hotspot use each
# laptop's local IP; on shared Wi-Fi use Tailscale 100.x addresses instead.

nodes:
  windows:                      # Windows, RTX 3050 — the agent's 8B model
    kind: ollama
    url: http://192.168.43.20:11434
  gpubox:                       # Linux, RTX 2050 — twin, synthetic participants, backup
    kind: ollama
    url: http://192.168.43.10:11434
  mac:                          # MacBook M3 — runs this server, so its Ollama is local
    kind: ollama
    url: http://localhost:11434

  # Optional cloud fallback (BYOK). The key is read from the named environment variable; it is
  # never written to disk or logs. Uncomment only if you have a key.
  # openai:
  #   kind: openai
  #   api_key_env: OPENAI_API_KEY
  # anthropic:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  # gemini:
  #   kind: gemini
  #   api_key_env: GEMINI_API_KEY

roles:
  agent:            # conversation + scenario actor (largest model)
    - windows/qwen3:8b
  extractor:        # personality-signal extraction
    - windows/qwen3:8b
  twin:             # digital twin persona
    - gpubox/gemma3:4b
  judge:            # outcome / questionnaire classification
    - mac/phi4-mini
    - gpubox/gemma3:4b
  sim_participant:  # synthetic participants for evaluation
    - gpubox/gemma3:4b

# Appended to every role as a last resort (e.g. if the Windows laptop drops off the hotspot).
fallback:
  - gpubox/llama3.2:3b
  - mac/phi4-mini
  # - anthropic/claude-haiku-5-5
